## Network Endpoints
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

### Server Listing & Privacy ###
sv_master1 ""
sv_hostname "My ESX Server"
sets sv_projectName "My ESX Server"
sets sv_projectDesc "ESX Legacy Server with Ox Inventory"
sets tags "esx, legacy, roleplay, ox"

## Server Keys & Slots
sv_maxclients 8
set steam_webApiKey ""
sv_licenseKey "" # Let txAdmin manage this, or paste your cfx key here

## Game Build & System Convars
sv_enforceGameBuild 3889
set resources_useSystemChat true
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on

## Database Connection (Matched to your running database)
set mysql_connection_string "mysql://root@localhost/ESXLegacy_173A36?waitForConnections=true&charset=utf8mb4"
set mysql_ui true

## PMA Voice Settings
setr voice_enableUi 0
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true

## Ox Inventory Setup Convars (Must load before ox_inventory starts)
setr inventory:framework "esx"

## Permissions
add_principal group.admin group.user
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow

