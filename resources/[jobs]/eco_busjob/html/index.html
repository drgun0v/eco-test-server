<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bus-hud" class="bus-hud-card hidden">
        <div class="hud-header">
            <div>
                <span class="hud-subtitle">Rute Metro Bus</span>
                <h1 id="current-stop-name" class="hud-title">Terminal</h1>
            </div>
            <div class="hud-counter">
                <span class="hud-counter-label">Pemberhentian</span>
                <div class="hud-counter-val"><span id="stop-current">1</span> / <span id="stop-total">33</span></div>
            </div>
        </div>

        <div class="stepper-box">
            <div class="stepper-col">
                <div id="step-prev" class="step-dot prev"></div>
                <span class="step-label">Lalu</span>
            </div>
            <div class="step-divider"></div>
            <div class="stepper-col">
                <div id="step-curr" class="step-dot curr"></div>
                <span class="step-label active">Sekarang</span>
            </div>
            <div class="step-divider"></div>
            <div class="stepper-col">
                <div id="step-next" class="step-dot next"></div>
                <span class="step-label">Tujuan</span>
            </div>
        </div>

        <div class="progress-box">
            <div class="progress-info">
                <span>Progress Rute</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-track">
                <div id="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div id="action-state" class="hud-status">
            Menuju halte berikutnya...
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
