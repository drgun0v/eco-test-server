<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-transparent overflow-hidden select-none">
    <div id="bus-hud" class="hidden absolute top-8 right-8 w-96 p-5 rounded-2xl glass-hud border border-white/20 shadow-2xl transition-all duration-300">
        <!-- Header Info -->
        <div class="flex items-center justify-between mb-3">
            <div>
                <span class="text-xs uppercase tracking-wider font-semibold text-cyan-200">Rute Metro Bus</span>
                <h1 id="current-stop-name" class="text-lg font-bold text-white truncate max-w-[200px]">Terminal</h1>
            </div>
            <div class="text-right">
                <span class="text-xs text-white/70">Pemberhentian</span>
                <div class="text-sm font-extrabold text-cyan-300"><span id="stop-current">1</span> / <span id="stop-total">35</span></div>
            </div>
        </div>

        <!-- 3-Dot Stepper -->
        <div class="flex items-center justify-between px-6 py-2 my-2 bg-black/20 rounded-xl border border-white/10">
            <div class="flex flex-col items-center">
                <div id="step-prev" class="w-3.5 h-3.5 rounded-full bg-cyan-200/40 border border-white/40 transition-colors"></div>
                <span class="text-[10px] text-white/60 mt-1">Lalu</span>
            </div>
            <div class="flex-1 h-[2px] bg-white/20 mx-2"></div>
            <div class="flex flex-col items-center">
                <div id="step-curr" class="w-4 h-4 rounded-full bg-cyan-300 shadow-[0_0_12px_#48CAE4] border border-white animate-pulse"></div>
                <span class="text-[10px] text-cyan-200 font-bold mt-1">Sekarang</span>
            </div>
            <div class="flex-1 h-[2px] bg-white/20 mx-2"></div>
            <div class="flex flex-col items-center">
                <div id="step-next" class="w-3.5 h-3.5 rounded-full bg-white/20 border border-white/20 transition-colors"></div>
                <span class="text-[10px] text-white/60 mt-1">Tujuan</span>
            </div>
        </div>

        <!-- Dynamic Progress Bar -->
        <div class="mt-4">
            <div class="flex justify-between text-xs text-white/80 mb-1">
                <span>Progress Rute</span>
                <span id="progress-percent" class="font-bold text-cyan-200">0%</span>
            </div>
            <div class="w-full bg-black/30 h-2.5 rounded-full overflow-hidden p-[2px] border border-white/10">
                <div id="progress-fill" class="h-full rounded-full progress-gradient transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Action / Passenger State -->
        <div id="action-state" class="mt-3 text-center text-xs py-1.5 px-3 rounded-lg bg-white/10 text-white/90 border border-white/10">
            Menuju halte berikutnya...
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
